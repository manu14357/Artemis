# sim/scenarios/engagement_response.yaml
# Scenario: 5 drones approaching from different angles to validate the
# CognitionPipeline -> SchedulerAgent -> effector dispatch path.
# All five drones are set on inbound courses designed to exceed the
# ThreatScorer's engagement threshold within ~30 s of simulation start.
# The scenario is intended for use with sim/drone_swarm.py in headless mode.

name: engagement_response
description: >
  Five approaching drones used to validate the end-to-end cognition pipeline:
  ThreatScorer -> CommandRouter -> SchedulerAgent -> effector dispatch + EngagementLog recording.

swarm:
  center:
    lat: 17.385
    lon: 78.487
    alt_m: 100
  formation: converging
  speed_mps: 10

drones:
  - id: drone-mavic-01
    model: DJI_Mavic3
    rf_freq: 2450000000
    start:
      lat: 17.3922
      lon: 78.4883
      alt_m: 80
    waypoints:
      - { lat: 17.385, lon: 78.487, alt_m: 80, speed_mps: 10 }

  - id: drone-mini-01
    model: DJI_Mini3
    rf_freq: 5800000000
    start:
      lat: 17.3935
      lon: 78.487
      alt_m: 40
    waypoints:
      - { lat: 17.385, lon: 78.487, alt_m: 40, speed_mps: 10 }

  - id: drone-autel-01
    model: Autel_Evo2
    rf_freq: 2400000000
    start:
      lat: 17.3871
      lon: 78.4859
      alt_m: 100
    waypoints:
      - { lat: 17.385, lon: 78.487, alt_m: 100, speed_mps: 10 }

  - id: drone-fpv-01
    model: FPV_Generic
    rf_freq: 915000000
    start:
      lat: 17.3781
      lon: 78.4885
      alt_m: 25
    waypoints:
      - { lat: 17.385, lon: 78.487, alt_m: 25, speed_mps: 10 }

  - id: drone-unknown-01
    model: unknown
    rf_freq: 2437000000
    start:
      lat: 17.3805
      lon: 78.4837
      alt_m: 60
    waypoints:
      - { lat: 17.385, lon: 78.487, alt_m: 60, speed_mps: 10 }
